# ============================================================
#  Local development MongoDB — optional alternative to Atlas.
#
#  Usage:
#    docker compose up -d        # start Mongo + web UI
#    docker compose down         # stop (data is preserved)
#    docker compose down -v      # stop and DELETE all data
#
#  Then set this in server/.env:
#    MONGODB_URI=mongodb://localhost:27017/socialapp
#
#  Web UI (browse your collections): http://localhost:8081
#
#  NOTE: this file was authored without a Docker installation available to
#  test it. The configuration follows the official mongo image docs, but it
#  has not been executed. Verify with `docker compose config` before relying
#  on it.
#
#  NOTE: MONGO_INITDB_ROOT_USERNAME/PASSWORD are only applied when MongoDB
#  initialises an EMPTY data directory. If a volume already exists from a
#  previous run with different credentials, the new ones are ignored and the
#  MONGODB_URI below will fail to authenticate. To start fresh:
#    docker compose down -v
# ============================================================

services:
  mongo:
    image: mongo:7
    container_name: mern-memories-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: mernmemories
      MONGO_INITDB_ROOT_PASSWORD: mernmemories_dev_password
      MONGO_INITDB_DATABASE: socialapp
    volumes:
      - mern-memories-mongo-data:/data/db
    healthcheck:
      # Ping the server so `docker compose up --wait` blocks until ready.
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          "db.adminCommand('ping').ok",
          '-u',
          'mernmemories',
          '-p',
          'mernmemories_dev_password',
          '--authenticationDatabase',
          'admin',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongo-express:
    image: mongo-express:1.0.2
    container_name: mern-memories-mongo-ui
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: mernmemories
      ME_CONFIG_MONGODB_ADMINPASSWORD: mernmemories_dev_password
      ME_CONFIG_MONGODB_URL: mongodb://mernmemories:mernmemories_dev_password@mongo:27017/
      ME_CONFIG_BASICAUTH: 'false'

volumes:
  mern-memories-mongo-data:
    driver: local
